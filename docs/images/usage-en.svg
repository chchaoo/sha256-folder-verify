<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Double-click verify.bat, drag in the original and the copy, read the verdict">
  <style>
    .card{fill:#f6f8fa;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 16px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
    .s{fill:#59636e;font:13px -apple-system,"Segoe UI","Noto Sans",Helvetica,Arial,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
    .mono{font:600 12px "Cascadia Mono",Consolas,Menlo,monospace}
    .num{fill:#0969da}
    .ln{stroke:#8c959f;fill:none}
    .lnf{fill:#8c959f}
    .paper{fill:#ffffff;stroke:#8c959f}
    .ink{fill:#1f2328}
    .win{fill:#0c0c0c;stroke:#8c959f}
    .ok{fill:#1a7f37}.bad{fill:#cf222e}
    @media (prefers-color-scheme:dark){
      .card{fill:#161b22;stroke:#30363d}
      .t{fill:#e6edf3}.s{fill:#9198a1}
      .num{fill:#4493f8}
      .ln{stroke:#6e7681}.lnf{fill:#6e7681}
      .paper{fill:#0d1117;stroke:#6e7681}.ink{fill:#e6edf3}
      .win{stroke:#3d444d}
      .ok{fill:#238636}.bad{fill:#da3633}
    }
  </style>

  <!-- cards -->
  <rect class="card" x="10" y="10" width="260" height="230" rx="14"/>
  <rect class="card" x="320" y="10" width="260" height="230" rx="14"/>
  <rect class="card" x="630" y="10" width="260" height="230" rx="14"/>

  <!-- arrows between cards -->
  <path class="ln" d="M280 115h26" stroke-width="2.5"/><path class="lnf" d="M306 108l10 7-10 7z"/>
  <path class="ln" d="M590 115h26" stroke-width="2.5"/><path class="lnf" d="M616 108l10 7-10 7z"/>

  <!-- step numbers -->
  <circle class="num" cx="36" cy="36" r="14"/><text x="36" y="41" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="14">1</text>
  <circle class="num" cx="346" cy="36" r="14"/><text x="346" y="41" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="14">2</text>
  <circle class="num" cx="656" cy="36" r="14"/><text x="656" y="41" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="14">3</text>

  <!-- step 1: the .bat file being double-clicked -->
  <path class="paper" d="M112 42h36l18 18v62a4 4 0 0 1-4 4h-50a4 4 0 0 1-4-4V46a4 4 0 0 1 4-4z" stroke-width="2"/>
  <path class="ln" d="M148 42v18h18" stroke-width="2"/>
  <rect x="116" y="88" width="42" height="20" rx="4" fill="#2f81f7"/>
  <text x="137" y="102.5" text-anchor="middle" fill="#fff" class="mono">.bat</text>
  <path d="M170 104l0 30 8-8 6 13 5-2-6-13 11 0z" fill="#ffffff" stroke="#1f2328" stroke-width="1.6" stroke-linejoin="round"/>
  <path class="ln" d="M176 98l7-6M179 106h9M172 94l2-9" stroke-width="2" stroke-linecap="round"/>

  <!-- step 2: two folders dragged into a console window -->
  <rect class="win" x="452" y="46" width="112" height="84" rx="6" stroke-width="1.5"/>
  <rect x="452" y="46" width="112" height="14" rx="6" fill="#2b2b2b"/>
  <rect x="452" y="54" width="112" height="6" fill="#2b2b2b"/>
  <text x="460" y="78" fill="#61d6d6" class="mono">SOURCE</text>
  <text x="460" y="94" fill="#cccccc" class="mono">&gt; D:\...</text>
  <text x="460" y="111" fill="#61d6d6" class="mono">TARGET</text>
  <text x="460" y="126" fill="#cccccc" class="mono">&gt; E:\...</text>
  <path d="M344 58h14l4 4h20a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3h-38a3 3 0 0 1-3-3V61a3 3 0 0 1 3-3z" fill="#d4a72c"/>
  <text x="363" y="82" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="11">1</text>
  <path d="M344 104h14l4 4h20a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3h-38a3 3 0 0 1-3-3v-26a3 3 0 0 1 3-3z" fill="#d4a72c"/>
  <text x="363" y="128" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="11">2</text>
  <path class="ln" d="M392 74C418 74 424 80 440 80" stroke-width="2" stroke-dasharray="4 4"/><path class="lnf" d="M440 74l9 6-9 6z"/>
  <path class="ln" d="M392 120C418 120 424 116 440 116" stroke-width="2" stroke-dasharray="4 4"/><path class="lnf" d="M440 110l9 6-9 6z"/>

  <!-- step 3: the verdict -->
  <rect class="ok" x="690" y="52" width="140" height="32" rx="16"/>
  <path d="M708 68l6 6 11-11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="772" y="73" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="14">PASSED</text>
  <rect class="bad" x="690" y="96" width="140" height="32" rx="16"/>
  <path d="M709 106l11 11M720 106l-11 11" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="772" y="117" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="14">FAILED</text>

  <!-- captions -->
  <text class="t" x="140" y="178" text-anchor="middle">Double-click verify.bat</text>
  <text class="s" x="140" y="202" text-anchor="middle">No install, no admin rights,</text>
  <text class="s" x="140" y="220" text-anchor="middle">nothing to configure</text>

  <text class="t" x="450" y="178" text-anchor="middle">Drag in both folders</text>
  <text class="s" x="450" y="202" text-anchor="middle">The original first, then the copy,</text>
  <text class="s" x="450" y="220" text-anchor="middle">press ENTER after each</text>

  <text class="t" x="760" y="178" text-anchor="middle">Read the verdict</text>
  <text class="s" x="760" y="202" text-anchor="middle">PASSED, or a list of every</text>
  <text class="s" x="760" y="220" text-anchor="middle">file that is not identical</text>
</svg>
